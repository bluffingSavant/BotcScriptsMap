name: Update BotcScripts data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scripts-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Extract script data
        run: python scripts/extract_json.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add botc_scripts/all_scripts.json botc_scripts/browser_index.json botc_scripts/extraction_state.json
          git diff --staged --quiet || git commit -m "chore: update BotcScripts data"
          git push
