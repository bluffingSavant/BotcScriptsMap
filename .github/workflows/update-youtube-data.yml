name: Update YouTube video data

on:
  schedule:
    - cron: "0 6 * * 1" # executed every Monday at 6:00 AM UTC
  workflow_dispatch:        # permet aussi un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-youtube-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch YouTube video data
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p youtube_data
          node scripts/youtube_channel_videos.js > youtube_data/youtube_videos.json

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_data/youtube_videos.json
          git diff --staged --quiet || git commit -m "chore: update youtube video data"
          git push